spring:
  application.name: cardbox-trading-cloud
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/occ}
    username: ${DATABASE_USER:occ}
    password: ${DATABASE_PASSWORD:occ}
    hikari.maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway.enabled: true
  jackson.serialization.write-dates-as-timestamps: false
  threads.virtual.enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  compression.enabled: true
  compression.mime-types: application/json,text/html,text/css,application/javascript,text/csv
management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
app:
  session-secret: ${APP_SESSION_SECRET}
  secure-cookie: ${APP_SECURE_COOKIE:true}
  # Auth0 Universal Login, in the same tenant as cardbox.club. AUTH0_DOMAIN may be the tenant domain or its custom login domain.
  auth0:
    domain: ${AUTH0_DOMAIN:}
    client-id: ${AUTH0_CLIENT_ID:}
    client-secret: ${AUTH0_CLIENT_SECRET:}
  # People, stores and roles from CardBox's API, called as the signed-in person with an access token for this audience.
  # Off until CardBox confirms its side is live; with it on, Trading stops managing its own team and stores.
  cardbox:
    enabled: ${CARDBOX_ENABLED:false}
    base-url: ${CARDBOX_BASE_URL:https://cardbox.club}
    audience: ${CARDBOX_AUDIENCE:https://cardbox.club/api}
  # cardbox.club pushes linked collections into store inventory with an Auth0 client-credentials token for this
  # audience (scope inventory:sync), issued to one of these client ids (CardBox's machine-to-machine application).
  club-sync:
    enabled: ${CLUB_SYNC_ENABLED:false}
    audience: ${CLUB_SYNC_AUDIENCE:https://cardbox.trading/api}
    client-ids: ${CLUB_SYNC_CLIENT_IDS:}
  # Help & feedback reports are saved here and, when GITHUB_ISSUES_TOKEN is set (a fine-grained token with Issues
  # read/write on this repository only), filed as sanitized GitHub issues. Without a token, reports are only saved.
  support:
    github:
      token: ${GITHUB_ISSUES_TOKEN:}
      repo: ${GITHUB_ISSUES_REPO:vanRoojen-LLC/CardBox}
      api-url: ${GITHUB_API_URL:https://api.github.com}
    admin-url: ${SUPPORT_ADMIN_URL:https://cardbox.trading/app/admin}
  # Month-to-date Azure cost for the health dashboard (GET /api/partner/club-sync/metrics), asked as the app's
  # user-assigned managed identity (Cost Management Reader on the resource group). Container Apps sets
  # IDENTITY_ENDPOINT and IDENTITY_HEADER; Bicep sets the rest. Anything missing just leaves the figure out.
  azure-cost:
    subscription-id: ${AZURE_SUBSCRIPTION_ID:}
    resource-group: ${AZURE_RESOURCE_GROUP:}
    client-id: ${AZURE_CLIENT_ID:}
    identity-endpoint: ${IDENTITY_ENDPOINT:}
    identity-header: ${IDENTITY_HEADER:}
  # Platform owner. Only counts once Auth0 has verified the address.
  owner-email: ${OWNER_EMAIL:toby@vanroojen.com}
  trial-days: 30
  # Every other game, from TCGTracking's free Open TCG API, run after the nightly imports. Gentle with a
  # free service: one request at a time, pause-ms apart, conditional on ETags, at most budget-minutes a night.
  tcgtracking:
    base: ${TCGTRACKING_BASE:https://openapi.tcgtracking.com/v1}
    pause-ms: ${TCGTRACKING_PAUSE_MS:1000}
    budget-minutes: ${TCGTRACKING_BUDGET_MINUTES:20}
  catalog.user-agent: CardBoxTrading/0.1 (+https://github.com/vanRoojen-LLC/CardBox-Trading)
